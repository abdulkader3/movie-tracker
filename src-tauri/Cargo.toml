[package]
name = "movie-tracker"
version = "0.1.0"
description = "A local-first personal movie and TV show tracker"
authors = ["Kader"]
edition = "2021"

[lib]
name = "movie_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
